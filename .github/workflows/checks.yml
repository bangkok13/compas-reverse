name: Checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: workshop
          POSTGRES_USER: workshop
          POSTGRES_PASSWORD: test-only
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U workshop" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DEBUG: "true"
      DATABASE_URL: postgres://workshop:test-only@127.0.0.1:5432/workshop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r backend/requirements/lock.txt
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py test apps.core
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck && npm run build
        working-directory: frontend
