client_max_body_size 55m;
server_tokens off;
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 95s;
location = /api/leads/ {
    limit_req zone=lead_limit burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://backend:8000;
}
location /api/ { proxy_pass http://backend:8000; }
location /admin/ {
    limit_req zone=admin_limit burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://backend:8000;
}
location /static/ { proxy_pass http://backend:8000; }
location /media/ {
    alias /srv/media/;
    add_header X-Content-Type-Options nosniff;
    add_header Content-Security-Policy "default-src 'none'; sandbox";
    expires 7d;
}
location ~ ^/(private|\.env|\.git)(/|$) { return 404; }
location / { proxy_pass http://frontend:3000; }
