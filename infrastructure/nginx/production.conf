limit_req_zone $binary_remote_addr zone=lead_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=30r/m;
server {
    listen 80;
    server_name _;
    location = /api/health/ { proxy_pass http://backend:8000; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/certificates/fullchain.pem;
    ssl_certificate_key /etc/nginx/certificates/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    include /etc/nginx/workshop/routes.conf;
}
