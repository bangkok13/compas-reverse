services:
  backend:
    environment:
      DEBUG: "false"
      SEED_DEMO: "false"
      SECURE_SSL_REDIRECT: "true"
  notifications:
    environment:
      DEBUG: "false"
      SEED_DEMO: "false"
      SECURE_SSL_REDIRECT: "true"
  frontend:
    environment:
      NUXT_PUBLIC_INDEXABLE: "true"
  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infrastructure/certificates:/etc/nginx/certificates:ro
